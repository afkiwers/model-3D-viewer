# Publishes the demo (index.html, step-viewer.js and models/) to GitHub Pages
# whenever a release is published. It can also be run by hand from the Actions tab.
name: Deploy GitHub Pages

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags, so a manual run can name its version
      - name: Collect site files
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir _site
          cp -r index.html step-viewer.js models _site/
          # Version details for the demo page's About dialog (not used by step-viewer.js).
          version="${RELEASE_TAG:-$(git describe --tags --always)}"
          jq -n \
            --arg version "$version" \
            --arg commit "$GITHUB_SHA" \
            --arg commitDate "$(git log -1 --format=%cI)" \
            --arg buildDate "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{version: $version, commit: $commit, commitDate: $commitDate, buildDate: $buildDate}' > _site/version.json
          cat _site/version.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
